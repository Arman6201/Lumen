name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -q Lumen.zip
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n' > Lumen/gradle.properties
          sed -i '/android:icon=/d;/android:roundIcon=/d' Lumen/app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: cd Lumen && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-apk
          path: Lumen/app/build/outputs/apk/debug/app-debug.apk
        
